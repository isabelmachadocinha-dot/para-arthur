<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poema da Bebel</title>
  <style>
    body {
      background-color: #111;
      color: #f5f5f5;
      font-family: 'Courier New', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      overflow: hidden;
    }

    #intro {
      font-size: 1.8rem;
      text-align: center;
      max-width: 800px;
      opacity: 0;
      transition: opacity 1s ease;
      white-space: nowrap;
    }

    #poem {
      font-size: 1.2rem;
      display: none;
      white-space: pre-wrap;
      max-width: 800px;
    }

    .author {
      margin-top: 2rem;
      opacity: 0;
      transition: opacity 1s ease;
    }
  </style>
</head>

<body>
  <div id="intro"></div>
  <div id="poem"></div>

  <script>
    const intro = document.getElementById('intro');
    const poemDiv = document.getElementById('poem');

    const introTexts = [
      "Uma coisinha pra você...",
      "...",
      "Feito especialmente para o Arthur",
      "...",
      "Espero que você goste 🤍",
      "Carregando poema"
    ];

    const poemText = `**Para o meu marrento favorito ♡**

Você tem esse jeito marrento,
essa pose de quem não sente,
olhar sério, passo lento,
como se nada te surpreendesse.

Postura de real gangster,
de quem não se deixa envolver,
faz de conta que não liga,
mas acho que gosta de me ter.

Você disfarça no silêncio,
esconde o carinho na provocação,
mas eu conheço esse seu jeito
e sei ler além da expressão.

Porque por trás dessa marra toda,
existe um Arthur que eu descobri:
um homem que, mesmo sem perceber,
foi ganhando espaço dentro de mim.

E talvez você nunca admita,
talvez faça graça e diga que não,
mas entre uma implicância e outra,
você acabou virando o meu coração.

Então fica aqui registrado,
nesse cantinho feito só pra você:
por mais marrento e gangster que seja,
eu ainda escolho você. ♡

❤❤❤.`;

    const author = "\n\n— Bebel · 16/09/2026";
    const fadeDuration = 1000; // tempo do fade in/out em ms
    const visibleDuration = 1500; // tempo que a frase fica visível em ms
    const speed = 90;
    let i = 0;

    function showIntroTexts(index = 0) {
      if (index >= introTexts.length) {
        intro.style.display = 'none';
        poemDiv.style.display = 'block';
        typePoem();
        return;
      }

      intro.textContent = introTexts[index];
      intro.style.opacity = 0;

      // Fade in
      setTimeout(() => {
        intro.style.opacity = 1;

        // Depois do tempo visível, faz fade out
        setTimeout(() => {
          intro.style.opacity = 0;

          // Depois do fade out, passa para a próxima frase
          setTimeout(() => {
            showIntroTexts(index + 1);
          }, fadeDuration);

        }, visibleDuration);

      }, 100);
    }

    function typePoem() {
      if (i < poemText.length) {
        poemDiv.innerHTML += poemText.charAt(i);
        i++;
        setTimeout(typePoem, speed);
      } else {
        setTimeout(() => {
          const authorTag = document.createElement("div");
          authorTag.className = "author";
          authorTag.textContent = author;
          poemDiv.appendChild(authorTag);
          authorTag.style.opacity = 1;
        }, 1000);
      }
    }

    // Começa a intro
    showIntroTexts();
  </script>
</body>

</html>
